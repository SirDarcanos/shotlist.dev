name: recipe-anatomy
install: public

setup:
  - click: { role: link, name: Docs }
  - wait: { css: '[data-recipe]' }

clip:
  css: '[data-recipe]'
  pad: 24

marks:
  drive: { within: clip, text: 'setup:' }
  region: { within: clip, text: 'clip:' }
  draw: { within: clip, text: 'callouts:' }

callouts:
