# The card a shared link unfurls into, annotated by the tool it is advertising.
#
# `inside: true` is not decoration: a label allowed outside grows the canvas to make room
# for it, and the card would stop being 1200×630.
name: og
install: public
url: http://localhost:4321/og/
viewport: { width: 1200, height: 630 }
scale: 2
clip: viewport

marks:
  install: { within: clip, text: npm i -D shotlist }

callouts:
  - { mark: install, text: Start here, place: right, inside: true, gap: 200 }
